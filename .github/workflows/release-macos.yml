name: Package macOS

on:
  push:
    tags: ['v*-preview.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, or leave empty to test the selected branch as Actions artifacts
        required: false
        type: string
      architecture:
        description: Architectures to package
        type: choice
        default: all
        options: [all, arm64, x64]
      arm_runner:
        description: Apple Silicon runner image
        type: choice
        default: macos-15
        options: [macos-15, macos-26]
      archive_only:
        description: Save Actions artifacts without attaching them to the release
        type: boolean
        default: false
      verify_download:
        description: Check the runtime of the existing public release packages
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && (inputs.arm_runner || 'macos-26') || 'macos-15-intel' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((github.event_name == 'push' || inputs.architecture == 'all') && '["arm64","x64"]' || format('["{0}"]', inputs.architecture)) }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          path: source
          persist-credentials: false

      - name: Check out the packaging script
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: packaging
          sparse-checkout: |
            tools/release/package-macos.sh
            tools/release/check-macos-runtime.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify release version
        working-directory: source
        env:
          NEXDESK_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          VERIFY_DOWNLOAD: ${{ inputs.verify_download }}
        run: |
          set -eu
          version=$(awk '$1 == "version:" { split($2, parts, "+"); print parts[1] }' apps/desktop/pubspec.yaml)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ -n $NEXDESK_TAG ]]; then
            [[ $NEXDESK_TAG == "v$version" || $NEXDESK_TAG =~ ^v"$version"-preview\.[1-9][0-9]*$ ]]
          else
            [[ $VERIFY_DOWNLOAD != true ]]
          fi
          printf 'NEXDESK_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Test the published bundle
        if: ${{ inputs.verify_download }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXDESK_TAG: ${{ inputs.tag }}
          NEXDESK_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          work=$(mktemp -d "$RUNNER_TEMP/nexdesk-download.XXXXXX")
          archive="NexDesk-$NEXDESK_VERSION-Desktop-macOS-$NEXDESK_ARCH.zip"
          gh release download "$NEXDESK_TAG" --repo "$GITHUB_REPOSITORY" --dir "$work" \
            --pattern "$archive" --pattern "$archive.sha256"
          (cd "$work" && shasum -a 256 -c "$archive.sha256")
          ditto -x -k "$work/$archive" "$work"
          codesign --verify --deep --strict "$work/NexDesk.app"
          python3 packaging/tools/release/check-macos-runtime.py "$work/NexDesk.app"

      - name: Check session window geometry and Retina video presentation
        if: ${{ !inputs.verify_download && hashFiles('source/apps/desktop/macos/Runner/SessionPresentation.swift') != '' }}
        working-directory: source
        run: |
          xcrun swiftc apps/desktop/macos/Runner/SessionPresentation.swift \
            tools/release/check-macos-presentation.swift -o "$RUNNER_TEMP/check-presentation"
          "$RUNNER_TEMP/check-presentation"

      - name: Set up Rust and Flutter
        if: ${{ !inputs.verify_download }}
        working-directory: source
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup override set 1.96.0
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --suppress-analytics --no-version-check precache --macos

      - name: Build and verify archive
        if: ${{ !inputs.verify_download }}
        run: NEXDESK_SOURCE_ROOT="$GITHUB_WORKSPACE/source" bash packaging/tools/release/package-macos.sh

      - name: Verify SDR color conversion and native frame buffers
        if: ${{ !inputs.verify_download }}
        working-directory: source
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          target=$(rustc -vV | awk '$1 == "host:" {print $2}')
          cargo test --release --locked --target "$target" -p nexdesk-media --lib

      - name: Verify the archived app and start its managed receiver
        if: ${{ !inputs.verify_download }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/nexdesk-keychain.XXXXXX")
          keychain="$work/receiver.keychain-db"
          previous=$(security default-keychain -d user 2>/dev/null | tr -d '"' | sed 's/^ *//') || previous=
          cleanup() {
            if [[ -n $previous ]]; then
              security default-keychain -d user -s "$previous"
            fi
            if [[ -f $keychain ]]; then
              security delete-keychain "$keychain"
            fi
            rmdir "$work" 2>/dev/null || true
          }
          trap cleanup EXIT
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          unset password
          security default-keychain -d user -s "$keychain"
          archive="NexDesk-$NEXDESK_VERSION-Desktop-macOS-${{ matrix.arch }}.zip"
          archives="$GITHUB_WORKSPACE/source/target/release-$NEXDESK_VERSION"
          (cd "$archives" && shasum -a 256 -c "$archive.sha256")
          unpacked=$(mktemp -d "$RUNNER_TEMP/nexdesk-unpacked.XXXXXX")
          ditto -x -k "$archives/$archive" "$unpacked"
          codesign --verify --deep --strict "$unpacked/NexDesk.app"
          python3 packaging/tools/release/check-macos-runtime.py "$unpacked/NexDesk.app"

      - name: Save verified archive
        if: ${{ !inputs.verify_download }}
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}-preview
          path: source/target/release-*/NexDesk-*-Desktop-macOS-${{ matrix.arch }}.zip*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Attach archive to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag && !inputs.verify_download && !inputs.archive_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXDESK_TAG: ${{ inputs.tag }}
          NEXDESK_ARCH: ${{ matrix.arch }}
        run: |
          archive="source/target/release-$NEXDESK_VERSION/NexDesk-$NEXDESK_VERSION-Desktop-macOS-$NEXDESK_ARCH.zip"
          gh release upload "$NEXDESK_TAG" "$archive" "$archive.sha256" --repo "$GITHUB_REPOSITORY" --clobber

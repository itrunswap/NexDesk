name: Package macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.1.4)
        required: true
        type: string
      architecture:
        description: Architectures to package
        type: choice
        default: all
        options: [all, arm64, x64]
      arm_runner:
        description: Apple Silicon runner image
        type: choice
        default: macos-15
        options: [macos-15, macos-26]
      archive_only:
        description: Save Actions artifacts without attaching them to the release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && inputs.arm_runner || 'macos-15-intel' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'all' && '["arm64","x64"]' || format('["{0}"]', inputs.architecture)) }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: source
          persist-credentials: false

      - name: Check out the packaging script
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: packaging
          sparse-checkout: tools/release/package-macos.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify release version
        working-directory: source
        env:
          NEXDESK_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          version=$(awk '$1 == "version:" { split($2, parts, "+"); print parts[1] }' apps/desktop/pubspec.yaml)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $NEXDESK_TAG == "v$version" ]]
          printf 'NEXDESK_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Set up Rust and Flutter
        working-directory: source
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup override set 1.96.0
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --suppress-analytics --no-version-check precache --macos

      - name: Build and verify archive
        run: NEXDESK_SOURCE_ROOT="$GITHUB_WORKSPACE/source" bash packaging/tools/release/package-macos.sh

      - name: Save verified archive
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}-preview
          path: source/target/release-*/NexDesk-*-Desktop-macOS-${{ matrix.arch }}.zip*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Attach archive to release
        if: ${{ !inputs.archive_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXDESK_TAG: ${{ inputs.tag }}
          NEXDESK_ARCH: ${{ matrix.arch }}
        run: |
          archive="source/target/release-$NEXDESK_VERSION/NexDesk-$NEXDESK_VERSION-Desktop-macOS-$NEXDESK_ARCH.zip"
          gh release upload "$NEXDESK_TAG" "$archive" "$archive.sha256" --repo "$GITHUB_REPOSITORY" --clobber

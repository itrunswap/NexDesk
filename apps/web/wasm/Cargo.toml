[package]
name = "nexdesk-browser-core"
description = "NexDesk authentication and protocol encoding for the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
nexdesk-session = { path = "../../../crates/nexdesk-session", default-features = false, features = ["browser"] }
serde_json.workspace = true
sha2.workspace = true
wasm-bindgen = "=0.2.130"

[lints]
workspace = true

[package]
name = "nexdesk-agent"
description = "NexDesk user-session host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
nexdesk-core.workspace = true
nexdesk-directory.workspace = true
nexdesk-files.workspace = true
nexdesk-media.workspace = true
nexdesk-platform.workspace = true
nexdesk-session.workspace = true
nexdesk-store.workspace = true
portable-pty = "0.9.0"
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[lints]
workspace = true

[package]
name = "nexdesk-platform"
description = "Desktop input and display coordinates for authorized NexDesk sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arboard = { version = "=3.7.0", default-features = false }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "=0.27.0"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8.9"
libpulse-binding = { version = "=2.30.1", default-features = false, features = ["pa_v13"] }
x11rb = { version = "=0.13.2", features = ["randr"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2 = "=0.6.5"
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["CMSampleBuffer"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSError", "NSObject"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-media"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

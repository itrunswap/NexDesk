[features]
default = ["native"]
native = ["dep:nexdesk-directory", "dep:nexdesk-media", "dep:nexdesk-platform", "dep:reqwest", "dep:tokio"]
browser = ["ring/wasm32_unknown_unknown_js"]

[dependencies]
prost.workspace = true
argon2.workspace = true
base64.workspace = true
nexdesk-core.workspace = true
nexdesk-directory = { workspace = true, optional = true }
nexdesk-media = { workspace = true, optional = true }
nexdesk-platform = { workspace = true, optional = true }
opaque-ke.workspace = true
rand.workspace = true
reqwest = { workspace = true, optional = true }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
zeroize.workspace = true

[lints]
workspace = true
